name: Bug report
description: Something in Intune Docs Studio misbehaves, fails or produces wrong output
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the dashboard, a sign-in method, the export, Git publishing or the
        package behaves incorrectly. Please check the
        [existing issues](https://github.com/helmerzNL/intune-docs-studio/issues?q=is%3Aissue) first.

        **Security problems do not belong here.** Report them privately, see
        [SECURITY.md](https://github.com/helmerzNL/intune-docs-studio/blob/beta/SECURITY.md).

        **Never paste tenant data into this issue.** That includes tenant IDs, tenant or
        user names, access tokens, exported policy content, script bodies and screenshots
        of the portal. Replace them with placeholders.

  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe the problem briefly and concretely.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Sign-in (any method)
        - Export / Markdown generation
        - Git publishing
        - Dashboard UI (web/)
        - Start-up, package or update
        - Scripts, hooks or CI (scripts/, .github/)
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: signin
    attributes:
      label: Sign-in method in use
      description: Leave empty if the problem is not related to signing in.
      options:
        - Use my Intune portal session
        - Sign in with browser
        - Device code
        - Azure CLI session
        - Graph PowerShell session
        - Not applicable

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked or ran, and which areas were selected for the export.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application version
      description: Contents of the VERSION file or the build shown in the dashboard. Say whether it is a beta or a stable build.
      placeholder: "0.1.0 (beta)"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: PowerShell and operating system
      description: Output of `$PSVersionTable.PSVersion` and your Windows version. PowerShell 7 or later is required.
      placeholder: "PowerShell 7.4.x, Windows 11"

  - type: textarea
    id: logs
    attributes:
      label: Output or error messages
      description: Paste the relevant output. Redact tenant identifiers, user names, tokens and any exported content.
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing reports of this problem
          required: true
        - label: This is not a security vulnerability
          required: true
        - label: I removed tenant data, tokens and other sensitive content from this report
          required: true
